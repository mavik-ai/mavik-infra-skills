name: Validate infrastructure skills
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s skills/coolify-ops/scripts -p 'test_*.py'
      - run: python -m compileall -q skills/coolify-ops/scripts
      - run: git diff --check
